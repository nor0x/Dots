name: build and release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix (for example, 2.3.0)
        required: true
        type: string

permissions:
  contents: write

env:
  APPLE_ID: ${{ secrets.APPLE_ID }}
  TEAM_ID: ${{ secrets.TEAM_ID }}
  APP_SPECIFIC_PWD: ${{ secrets.APP_SPECIFIC_PWD }}
  SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
  # notarytool keychain profile created in the build-macos job and consumed by vpk
  NOTARY_PROFILE: DotsNotary

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
      - name: Resolve release version
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
            version="${tag#v}"
          else
            version="$INPUT_VERSION"
            tag="v$version"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must be SemVer, for example 2.3.0 or 2.3.0-preview.1." >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-macos:
    needs: prepare-release
    runs-on: macos-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: restore workloads
        run: |
          cd $GITHUB_WORKSPACE/src
          dotnet workload restore
      - name: Install Velopack CLI
        run: |
          dotnet tool install -g vpk --version 1.2.0
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - name: run housekeeping scripts
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          cd $GITHUB_WORKSPACE/scripts
          bash housekeeping.sh
      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.provisionprofile
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Store notarization credentials
        run: |
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_SPECIFIC_PWD"
      - name: run build scripts
        run: |
          cd $GITHUB_WORKSPACE/scripts
          bash build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-releases
          path: ${{ github.workspace }}/releases

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: restore workloads
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/src
          dotnet workload restore
      - name: Install Velopack CLI
        shell: bash
        run: dotnet tool install -g vpk --version 1.2.0
      - name: run housekeeping scripts
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/scripts
          bash housekeeping.sh
      - name: run build scripts
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/scripts
          bash build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-releases
          path: ${{ github.workspace }}\releases

  create-release:
    needs: [prepare-release, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Create release tag for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
      - name: run housekeeping scripts
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          cd $GITHUB_WORKSPACE/scripts
          bash housekeeping.sh
      - uses: actions/download-artifact@v4
        with:
          name: macos-releases
          path: ${{ github.workspace }}/releases
      - uses: actions/download-artifact@v4
        with:
          name: windows-releases
          path: ${{ github.workspace }}/releases

      - name: Display structure of downloaded files
        run: ls -la ${{ github.workspace }}/releases
      - name: Install DiffLog
        run: dotnet tool install -g DiffLog
      - name: Generate Release Notes
        env:
          OPENAI_API_KEY: ${{ secrets.OPEN_AI_API_KEY }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CURRENT_REF=HEAD

          if [ -n "$PREV_TAG" ]; then
            difflog generate --from "$PREV_TAG" --to "$CURRENT_REF" --format Markdown -o release-notes.md --system-prompt "Generate developer friendly release notes based on this git history information. Include SHA hashes and structure the changelog in bullet points. don't make it too long and don't overcomplicate it. keep it clean (subtle emoji usage is allowed)."
          else
            difflog generate --to "$CURRENT_REF" --format Markdown -o release-notes.md --system-prompt "Generate developer friendly release notes based on this git history information. Include SHA hashes and structure the changelog in bullet points. don't make it too long and don't overcomplicate it. keep it clean (subtle emoji usage is allowed)."
          fi
      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          tag: "${{ needs.prepare-release.outputs.tag }}"
          name: "Release ${{ needs.prepare-release.outputs.version }}"
          artifacts: |
            ${{ github.workspace }}/releases/*
          token: ${{ secrets.GITHUB_TOKEN }}
          bodyFile: release-notes.md
          generateReleaseNotes: false
          # Velopack's GithubSource ignores drafts, so publishing the draft by hand is what
          # actually rolls the update out to installed apps.
          draft: true
