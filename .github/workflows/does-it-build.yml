name: build validation

# run it on dispatch or for every PR
on:
  pull_request:
  workflow_dispatch:

env:
  APPLE_ID: ${{ secrets.APPLE_ID }}
  TEAM_ID: ${{ secrets.TEAM_ID }}
  APP_SPECIFIC_PWD: ${{ secrets.APP_SPECIFIC_PWD }}
  SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
  # notarytool keychain profile created in the build-macos job and consumed by vpk
  NOTARY_PROFILE: DotsNotary
  RELEASE_VERSION: 0.0.0-ci.${{ github.run_number }}

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: restore workloads
        run: |
          cd $GITHUB_WORKSPACE/src
          dotnet workload restore
      - name: Install Velopack CLI
        run: |
          dotnet tool install -g vpk --version 1.2.0
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - name: run housekeeping scripts
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          cd $GITHUB_WORKSPACE/scripts
          bash housekeeping.sh
      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.provisionprofile
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Store notarization credentials
        run: |
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_SPECIFIC_PWD"
      - name: run build scripts
        run: |
          cd $GITHUB_WORKSPACE/scripts
          bash build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-releases
          path: ${{ github.workspace }}/releases

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: restore workloads
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/src
          dotnet workload restore
      - name: Install Velopack CLI
        shell: bash
        run: dotnet tool install -g vpk --version 1.2.0
      - name: run housekeeping scripts
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/scripts
          bash housekeeping.sh
      - name: run build scripts
        shell: bash
        run: |
          cd $GITHUB_WORKSPACE/scripts
          bash build-windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows-releases
          path: ${{ github.workspace }}\releases

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: linux-arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      LINUX_RID: ${{ matrix.rid }}
      # appimagetool ships as an AppImage itself and there is no FUSE on the runners
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4.1.1
      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Install AppImage tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils
      - name: restore workloads
        run: |
          cd $GITHUB_WORKSPACE/src
          dotnet workload restore
      - name: Install Velopack CLI
        run: |
          dotnet tool install -g vpk --version 1.2.0
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - name: run housekeeping scripts
        run: |
          cd $GITHUB_WORKSPACE/scripts
          bash housekeeping.sh
      - name: run build scripts
        run: |
          cd $GITHUB_WORKSPACE/scripts
          bash build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-releases-${{ matrix.rid }}
          path: ${{ github.workspace }}/releases
